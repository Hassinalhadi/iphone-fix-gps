name: Decompile & Extract Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze-dylib:
    runs-on: macos-latest

    steps:
      - name: 1. جلب الكود من المستودع
        uses: actions/checkout@v4

      - name: 2. تجهيز مجلدات المخرجات
        run: |
          mkdir -p output/headers
          mkdir -p output/analysis

      - name: 3. استخراج بيانات Objective-C والترويسات
        run: |
          echo "=== جاري فحص واستخراج كلاسات Objective-C ==="
          # استخراج البنية الكاملة للكلاسات والدوال عبر أداة Apple الرسمية
          otool -ov hsrider.dylib > output/headers/objc_raw_metadata.txt

          # تحويل بيانات otool إلى ترويسات Objective-C (.h) مقروءة عبر بايثون
          python3 - << 'EOF'
          import re

          with open("output/headers/objc_raw_metadata.txt", "r") as f:
              content = f.read()

          classes = re.findall(r'Meta Class\s+0x[0-9a-f]+\s+([^\n]+).*?Instance Methods\s+.*?(?=\n\w|\Z)', content, re.DOTALL)
          
          with open("output/headers/ExtractedClasses.h", "w") as out:
              out.write("// Auto-extracted Objective-C interfaces from hsrider.dylib\n\n")
              
              current_class = None
              for line in content.splitlines():
                  cls_match = re.search(r'^\s*name\s+0x[0-9a-f]+\s+([A-Za-z0-9_]+)', line)
                  meth_match = re.search(r'^\s*name\s+0x[0-9a-f]+\s+([A-Za-z0-9_:]+)\s*$', line)
                  type_match = re.search(r'^\s*types\s+0x[0-9a-f]+\s+([^\n]+)', line)
                  
                  if cls_match:
                      cname = cls_match.group(1)
                      if cname != current_class and not cname.startswith("v@") and not cname.startswith("@"):
                          current_class = cname
                          out.write(f"\n@interface {current_class} : NSObject\n")
                  elif meth_match and current_class:
                      mname = meth_match.group(1)
                      if not mname.startswith("0x"):
                          out.write(f"- (void){mname};\n")
                  elif "baseMethods" in line and current_class:
                      pass
              out.write("\n@end\n")
          EOF

      - name: 4. استخراج النصوص والرموز والتفكيك البرمجي
        run: |
          echo "=== استخراج الرموز والنصوص ==="
          # استخراج النصوص والمفاتيح والروابط
          strings -a hsrider.dylib > output/analysis/strings.txt

          # استخراج جدول الرموز والدوال المصدرة
          nm -gU hsrider.dylib > output/analysis/symbols.txt

          # استخراج المكتبات المرتبطة
          otool -L hsrider.dylib > output/analysis/dependencies.txt

          # تفكيك تعليمات التجميع ARM64 (Disassembly)
          otool -tvV hsrider.dylib > output/analysis/disassembly.asm

      - name: 5. رفع النتائج كـ Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsrider-analysis-results
          path: output/
