name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. جلب ملفات المشروع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. إعداد وتثبيت بيئة Theos والـ iOS SDKs تلقائياً
      - name: Setup Theos Environment
        uses: Randomblock1/theos-action@v1

      # 3. تجميع وبناء الحزمة
      - name: Compile & Package Tweak
        run: |
          make clean
          make package FINALPACKAGE=1 messages=yes

      # 4. نسخ ملف الـ dylib إلى مجلد مستقل ومرئي
      - name: Extract Dylib to Output Directory
        if: always()
        run: |
          mkdir -p dylib_output
          find .theos -name "*.dylib" -exec cp {} dylib_output/ \;

      # 5. رفع حزمة التثبيت (.deb)
      - name: Upload .deb Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DEB
          path: packages/*.deb

      # 6. رفع ملف المكتبة المجمعة (.dylib)
      - name: Upload .dylib File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DYLIB
          path: dylib_output/*.dylib
