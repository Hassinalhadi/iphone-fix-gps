name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. جلب ملفات المشروع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. إعداد وتثبيت بيئة Theos والـ iOS SDKs تلقائياً
      - name: Setup Theos Environment
        uses: Randomblock1/theos-action@v1

      # 3. تجميع وبناء الحزمة مع إظهار تفاصيل الترجمة (Verbose)
      - name: Compile & Package Tweak
        run: |
          make clean
          make package FINALPACKAGE=1 messages=yes

      # 4. رفع حزمة التثبيت (.deb)
      - name: Upload .deb Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DEB
          path: packages/*.deb

      # 5. رفع ملف المكتبة المجمعة (.dylib)
      - name: Upload .dylib File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DYLIB
          path: .theos/obj*/**/*.dylib
