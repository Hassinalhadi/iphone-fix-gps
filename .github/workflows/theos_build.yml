name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-package:
    runs-on: macos-latest

    steps:
      - name: 1. جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت أدوات الحزم وتوقيع الكود (ldid & dpkg)
        run: |
          brew update
          brew install ldid dpkg

      - name: 3. تثبيت بيئة Theos والـ iOS SDKs
        run: |
          # استنساخ Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # جلب مكتبات الـ SDK المتوافقة مع معمارية iOS
          git clone --quiet https://github.com/theos/sdks.git $HOME/theos/sdks
          
          # تعيين مسار THEOS في بيئة العمل
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 4. تجميع وبناء الأداة (Compile & Package)
        run: |
          export THEOS=$HOME/theos
          
          # بناء الحزمة النهائية .deb
          make clean
          make package FINALPACKAGE=1

      - name: 5. رفع حزمة التثبيت (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DEB
          path: packages/*.deb

      - name: 6. رفع ملف المكتبة المجمعة (.dylib)
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DYLIB
          path: .theos/obj/debug/*.dylib
