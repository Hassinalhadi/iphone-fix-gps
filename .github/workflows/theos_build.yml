name: Theos Analysis & Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: macos-latest

    steps:
      - name: جلب الكود من المستودع
        uses: actions/checkout@v4

      - name: تثبيت أدوات الفحص والهندسة العكسية
        run: |
          brew update
          brew install class-dump || true
          mkdir -p output/headers output/analysis

      - name: 1. استخراج الـ Headers ومعلومات المكتبة
        run: |
          echo "=== فحص المكتبة الأصلية ==="
          file hsrider.dylib > output/analysis/info.txt
          otool -L hsrider.dylib >> output/analysis/info.txt
          
          # استخراج نصوص ورموز المكتبة
          strings -a hsrider.dylib > output/analysis/strings.txt
          nm -gU hsrider.dylib > output/analysis/symbols.txt
          
          # استخراج واجهات Objective-C
          if command -v class-dump &> /dev/null; then
            class-dump -H -o output/headers hsrider.dylib || true
          fi

      - name: 2. إعداد بيئة Theos والـ SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          
          # جلب iOS SDK متوافق مع ARM64
          git clone --quiet https://github.com/theos/sdks.git ~/theos/sdks-repo
          cp -r ~/theos/sdks-repo/iPhoneOS14.4.sdk ~/theos/sdks/ || true

      - name: 3. بناء الأداة المعدلة عبر Theos
        run: |
          export THEOS=~/theos
          # تجميع وبناء حزمة .deb
          make package FINALPACKAGE=1

      - name: 4. رفع مخرجات التحليل والملفات المستخرجة
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-Headers-And-Analysis
          path: output/

      - name: 5. رفع حزمة Theos الناتجة (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: Built-Tweak-Package
          path: packages/*.deb
