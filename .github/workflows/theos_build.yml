name: Decompile & Extract Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze-dylib:
    runs-on: macos-latest

    steps:
      - name: 1. جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: 2. تجهيز مجلدات المخرجات
        run: |
          mkdir -p output/headers
          mkdir -p output/analysis

      - name: 3. تحميل أداة dsdump لمعمارية ARM64
        run: |
          # تحميل أداة dsdump الحديثة المخصصة لاستخراج كلاسات Objective-C
          curl -sL "https://github.com/DerekSelander/dsdump/releases/download/v0.1.1/dsdump_macOS.zip" -o dsdump.zip
          unzip -q dsdump.zip
          chmod +x dsdump
          sudo mv dsdump /usr/local/bin/ || mv dsdump .

      - name: 4. استخراج الترويسات (Headers) وهيكل الكلاسات
        run: |
          DSDUMP_BIN=$(which dsdump 2>/dev/null || echo "./dsdump")
          
          # استخراج الواجهات الكاملة Objective-C
          $DSDUMP_BIN --objc -u hsrider.dylib > output/headers/AllClasses.h || true
          
          # استخراج البروتوكولات والـ Symbols بالتفصيل
          $DSDUMP_BIN -a -u hsrider.dylib > output/headers/FullSymbolsDump.txt || true

      - name: 5. استخراج النصوص، الرموز، والتفكيك (Disassembly)
        run: |
          # استخراج كافة النصوص المضمنة (روابط، رسائل، متغيرات)
          strings -a hsrider.dylib > output/analysis/strings.txt
          
          # استخراج جدول الرموز
          nm -gU hsrider.dylib > output/analysis/symbols.txt
          
          # استخراج المكتبات المترابطة
          otool -L hsrider.dylib > output/analysis/linked_libraries.txt
          
          # تفكيك تعليمات التجميع ARM64
          otool -tvV hsrider.dylib > output/analysis/disassembly.asm

      - name: 6. رفع كافة المخرجات المستخرجة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsrider-decompiled-files
          path: output/
