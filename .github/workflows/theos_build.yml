name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. جلب ملفات مشروعك (Makefile, control, Tweak.x)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. تثبيت Theos والـ iOS SDKs تلقائياً وبشكل مضمون
      - name: Setup Theos Environment
        uses: Randomblock1/theos-action@v1

      # 3. بناء وتجميع الأداة
      - name: Compile & Package Tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      # 4. رفع حزمة .deb الناتجة
      - name: Upload .deb Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DEB
          path: packages/*.deb

      # 5. رفع ملف المكتبة .dylib الناتجة
      - name: Upload .dylib File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRider-DYLIB
          path: .theos/obj*/**/*.dylib
