name: Build Patched Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Patch Library
        run: |
          mkdir -p output
          
          # استخدام -dynamiclib الصحيح لمعمارية arm64 ونظام iOS
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=14.0 \
            -framework Foundation -framework UIKit \
            -fobjc-arc -Wno-deprecated-declarations \
            patch.m -o output/hsrider_patch.dylib

          # العثور على ملف hsrider.dylib ونسخه تلقائياً
          find . -maxdepth 2 -name "*.dylib" -not -path "./output/*" -exec cp {} output/hsrider.dylib \;

      - name: Upload Final Dylib Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Dylib-Package
          path: output/
