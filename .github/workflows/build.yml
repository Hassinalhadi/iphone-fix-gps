name: Decompile & Analyze Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools & Environment
        run: |
          mkdir -p output bin
          # تحميل dsdump الجاهز مباشرة من المستودع الرسمي
          curl -sSL "https://github.com/DerekSelander/dsdump/raw/master/compiled/dsdump" -o bin/dsdump
          chmod +x bin/dsdump
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Locate Target Dylib
        run: |
          # العثور على ملف dylib تلقائياً سواء كان hsrider.dylib أو أي اسم آخر
          TARGET=$(find . -maxdepth 2 -name "*.dylib" -not -path "*/.*" | head -n 1)
          if [ -z "$TARGET" ]; then
            echo "::error::لم يتم العثور على أي ملف .dylib في المستودع!"
            exit 1
          fi
          echo "TARGET_DYLIB=$TARGET" >> $GITHUB_ENV
          echo "Found dylib: $TARGET"

      - name: Extract Mach-O Info & Strings
        run: |
          echo "=== File Architecture ===" > output/info.txt
          file "$TARGET_DYLIB" >> output/info.txt
          otool -hv "$TARGET_DYLIB" >> output/info.txt

          echo "=== Dependencies ===" > output/dependencies.txt
          otool -L "$TARGET_DYLIB" >> output/dependencies.txt

          echo "=== Strings ===" > output/strings.txt
          strings "$TARGET_DYLIB" >> output/strings.txt

      - name: Dump Objective-C Headers & Classes
        run: |
          # استخراج كلاسات Objective-C بواسطة dsdump
          if command -v dsdump &> /dev/null; then
            dsdump --objc --verbose "$TARGET_DYLIB" > output/objc_classes.h || true
          fi
          
          # استخراج هياكل الميثودات والبروتوكولات عبر otool الأصلي
          otool -ov "$TARGET_DYLIB" > output/objc_runtime_structures.txt

      - name: Disassemble ARM64 Assembly
        run: |
          # التفكيك الكامل للأسمبلي مع ربطه بميثودات Objective-C
          xcrun llvm-objdump -d --macho --objc-meta-data "$TARGET_DYLIB" > output/disassembly.asm || \
          otool -tV "$TARGET_DYLIB" > output/disassembly.asm

          # استخراج جدول الرموز (Symbols)
          nm -gU "$TARGET_DYLIB" > output/symbols.txt || true

      - name: Upload Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dylib-decompiled-analysis
          path: output/
